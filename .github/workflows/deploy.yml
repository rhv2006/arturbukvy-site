# Сборка сайта и загрузка в бакет Yandex Object Storage (хостинг в России, открывается без VPN).
# Запускается при каждом пуше в main, раз в сутки по расписанию (чтобы подтянуть новые кейсы
# с Behance и статьи с Teletype) и вручную кнопкой «Run workflow» на вкладке Actions.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   KEY_ID, SECRET_KEY — статический ключ сервисного аккаунта с ролью storage.editor.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # 06:00 по Москве
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BUCKET: xn--80acd5a2aanic6f.xn--p1ai # артурбуквы.рф
  AWS_ACCESS_KEY_ID: ${{ secrets.KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
  AWS_DEFAULT_REGION: ru-central1
  # Канал от раннера GitHub до Object Storage медленный и иногда отвечает 500 — повторяем запросы.
  AWS_RETRY_MODE: standard
  AWS_MAX_ATTEMPTS: 8
  S3: aws s3 --endpoint-url=https://storage.yandexcloud.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # Новый CRT-клиент AWS CLI рвёт соединение, если скорость ниже порога («throughput minimum»),
      # а до Object Storage она бывает ~250 КБ/с. Классический клиент медленнее, но не обрывает загрузку.
      - name: AWS CLI classic transfer client
        run: aws configure set default.s3.preferred_transfer_client classic

      # Файлы в _astro с хешем в имени не меняются — браузер может хранить их год.
      - name: Upload hashed assets
        run: $S3 sync dist/_astro "s3://$BUCKET/_astro" --cache-control "public, max-age=31536000, immutable"

      # Тяжёлые файлы (видео, картинки, резюме) сравниваются только по размеру: сборка каждый раз даёт им
      # новую дату, и без --size-only все ~19 МБ заливались бы заново на каждом деплое.
      - name: Upload media
        run: >-
          $S3 sync dist "s3://$BUCKET" --size-only --delete --cache-control "public, max-age=300"
          --exclude "*" --include "video/*" --include "xp/*" --include "covers/*" --include "projects/*"
          --include "*.pdf" --include "*.jpg" --include "*.png" --include "*.webp"

      # Остальное (страницы, sitemap, иконки) — каждый раз, короткий кеш, чтобы правки появлялись быстро.
      # --delete убирает из бакета файлы, которых больше нет в сборке.
      - name: Upload site
        run: >-
          $S3 sync dist "s3://$BUCKET" --cache-control "public, max-age=300" --delete
          --exclude "_astro/*" --exclude "video/*" --exclude "xp/*" --exclude "covers/*" --exclude "projects/*"
          --exclude "*.pdf" --exclude "*.jpg" --exclude "*.png" --exclude "*.webp"

      - name: Remove stale hashed assets
        run: $S3 sync dist/_astro "s3://$BUCKET/_astro" --delete

      # www.артурбуквы.рф: отдельный бакет с одной страницей-переадресацией на основной домен.
      - name: Upload www redirect
        run: $S3 cp www-redirect/index.html "s3://www.$BUCKET/index.html" --cache-control "public, max-age=3600"
