# Сборка сайта и загрузка в бакет Yandex Object Storage (хостинг в России, открывается без VPN).
# Запускается при каждом пуше в main, раз в сутки по расписанию (чтобы подтянуть новые кейсы
# с Behance и статьи с Teletype) и вручную кнопкой «Run workflow» на вкладке Actions.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   KEY_ID, SECRET_KEY — статический ключ сервисного аккаунта с ролью storage.editor.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # 06:00 по Москве
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BUCKET: xn--80acd5a2aanic6f.xn--p1ai # артурбуквы.рф
  AWS_ACCESS_KEY_ID: ${{ secrets.KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
  AWS_DEFAULT_REGION: ru-central1
  S3: aws s3 --endpoint-url=https://storage.yandexcloud.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # Файлы в _astro с хешем в имени не меняются — браузер может хранить их год.
      - name: Upload hashed assets
        run: $S3 sync dist/_astro "s3://$BUCKET/_astro" --cache-control "public, max-age=31536000, immutable"

      # Остальное (страница, видео, обложки, резюме) — короткий кеш, чтобы правки появлялись быстро.
      # --delete убирает из бакета файлы, которых больше нет в сборке.
      - name: Upload site
        run: $S3 sync dist "s3://$BUCKET" --exclude "_astro/*" --cache-control "public, max-age=300" --delete

      - name: Remove stale hashed assets
        run: $S3 sync dist/_astro "s3://$BUCKET/_astro" --delete
