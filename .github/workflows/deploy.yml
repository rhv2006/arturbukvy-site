# Сборка и публикация сайта на GitHub Pages.
# Запускается при каждом пуше в main, раз в сутки по расписанию (чтобы подтянуть новые кейсы
# с Behance и статьи с Teletype) и вручную кнопкой «Run workflow» на вкладке Actions.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # 06:00 по Москве
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
